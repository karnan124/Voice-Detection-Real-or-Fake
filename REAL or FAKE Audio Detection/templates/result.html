<!DOCTYPE html>
<html>
<head>
    <title>Real or Fake Detection Result</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1200px;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .container {
            text-align: center;
            padding: 30px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.8));
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            transform-style: preserve-3d;
            transform: rotateX(20deg) rotateY(-20deg) translateZ(30px) scale(0.9);
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            z-index: 1;
        }

        .container:hover {
            transform: rotateX(0deg) rotateY(0deg) translateZ(0px) scale(1);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        h1 {
            color: #4a4a4a;
            font-size: 2.2em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            color: #333333;
            margin-top: 20px;
            font-size: 1.3em;
            font-weight: bold;
        }

        .button-container {
            margin-top: 25px;
        }

        .back-button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: #ffffff;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            transform: translateZ(10px);
        }

        .back-button:hover {
            background: linear-gradient(45deg, #764ba2, #667eea);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
            transform: translateZ(15px) scale(1.05);
        }

        .fake {
            background-color: red;
            color: white;
            padding: 10px;
            border-radius: 4px;
        }

        .real {
            background-color: green;
            color: white;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Real or Fake Detection Result</h1>
        <p class="{% if 'Fake' in result %}fake{% else %}real{% endif %}">{{ result }}</p>
        <div class="button-container">
            <button class="back-button" onclick="goBack()">Analyze Another File</button>
        </div>
    </div>

    <script>
        function goBack() {
            window.location.href = "/";
        }
    </script>
</body>
</html>
